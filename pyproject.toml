[project]
name = "brow-guessr"
version = "0.1.0"
description = "Head-IMU + eyebrow-EMG GeoGuesser for kids, on the NeuroPawn Knight IMU board."
requires-python = ">=3.11,<3.14"
dependencies = [
    "ahrs>=0.3.1",
    "brainflow>=5.21.0",
    "fastapi>=0.115",
    "numpy>=1.26",
    "pyserial>=3.5",
    "scipy>=1.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
