<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brow Guessr</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- All visible text comes from strings.js (data-s* attributes are filled in by applyStrings). -->
<body class="game is-paused at-start">
  <header class="topbar">
    <span id="round"></span>
    <span id="score"></span>
    <span id="status" class="status" role="status"></span>
  </header>

  <section id="start" class="start-screen">
    <div class="start-inner">
      <h1 class="title" data-s="start.title"></h1>
      <p class="tagline" data-s="start.tagline"></p>
      <div id="start-meter"></div>
    </div>
    <div class="action-row">
      <button id="profile" class="big" data-s-label="start.profile.label"></button>
      <button id="tone" class="big" data-s="start.tone" data-s-label="start.tone.label"></button>
      <button id="speech" class="big" data-s-label="start.speech.label" aria-pressed="false"></button>
      <button id="play" class="big primary" data-s="start.play" data-s-label="start.play.label"></button>
    </div>
  </section>

  <section id="look" class="screen" hidden>
    <div id="pano"></div>
    <div id="pano-missing" class="pano-missing" hidden>
      <h2 data-s="look.noKey.title"></h2>
      <p data-s-html="look.noKey.body"></p>
    </div>
    <!-- walking (double raises): where a single raise walks to -->
    <div id="aim" class="aim" hidden></div>
    <div id="walk-marker" class="walk-marker" hidden><span>⬆</span><small data-s="look.walkHere"></small></div>
    <div id="road-edge" class="road-edge" hidden></div>
    <div id="pano-none" class="pano-missing" hidden>
      <h2 data-s="look.noPano.title"></h2>
      <p data-s="look.noPano.body"></p>
    </div>
    <div id="loc-hint" class="loc-hint" hidden><span data-s="look.hint"></span> <span id="loc-hint-text"></span></div>
    <!-- head guidance: chevrons glow with turning speed; the stick shows tilt vs the dead zone -->
    <div class="chevron chev-left" aria-hidden="true">‹</div>
    <div class="chevron chev-right" aria-hidden="true">›</div>
    <div class="chevron chev-up" aria-hidden="true">‹</div>
    <div class="chevron chev-down" aria-hidden="true">›</div>
    <!-- single input (no double raise): the bottom quarter holds the choices, the rest turns the camera -->
    <div id="single-band" class="single-band" hidden>
      <div id="single-instruction" class="hint single-instruction" role="status"></div>
      <div class="action-row single-row">
        <button id="tile-walk" class="big" data-s="single.walk" data-s-label="single.walk.label"></button>
        <button id="tile-map" class="big primary" data-s="single.map" data-s-label="single.map.label"></button>
        <button id="tile-pause" class="big" data-s="single.pause" data-s-label="single.pause.label"></button>
      </div>
    </div>
    <div class="action-row look-row">
      <div id="look-stick" class="look-stick" aria-hidden="true"><div class="stick-dz"></div><div class="stick-dot"></div></div>
      <div id="look-hint" class="hint look-pill" role="status"></div>
      <button id="to-map" class="big primary" data-s="look.map" data-s-label="look.map.label" title="Mouse: drag to look around, click arrows to walk"></button>
    </div>
  </section>

  <section id="guess" class="screen" hidden>
    <div id="map"></div>
    <div class="top-band" aria-hidden="true"></div>
    <div class="action-row">
      <button id="look-again" class="big" data-s="guess.look" data-s-label="guess.look.label"></button>
      <button id="zoom-out" class="big round" data-s-label="guess.zoomOut.label" data-s-aria="guess.zoomOut.label">－</button>
      <button id="zoom-in" class="big round" data-s-label="guess.zoomIn.label" data-s-aria="guess.zoomIn.label">＋</button>
      <button id="submit-guess" class="big primary" disabled></button>
      <!-- assist "choices": three named places instead of pin-dropping -->
      <button id="choice-0" class="big choice" hidden></button>
      <button id="choice-1" class="big choice" hidden></button>
      <button id="choice-2" class="big choice" hidden></button>
    </div>
    <div id="guess-hint" class="hint small"></div>
  </section>

  <section id="result" class="card-screen" hidden>
    <div class="card" role="status">
      <div id="stars" class="stars"></div>
      <h1 id="result-title"></h1>
      <p class="result-place"><span data-s="result.itWas"></span> <b id="result-place"></b></p>
      <div class="result-numbers">
        <div><span id="result-distance"></span><small data-s="result.away"></small></div>
        <div><span id="result-points"></span><small data-s="result.points"></small></div>
      </div>
      <p id="result-fact" class="fact"></p>
      <button id="next" class="big primary countdown" data-s-label="result.next.label" style="--p: 0"><span id="next-text"></span><span class="countdown-ring" aria-hidden="true"></span></button>
    </div>
  </section>

  <section id="final" class="final-screen" hidden>
    <div class="card" role="status">
      <div class="stars">🏆</div>
      <h1 id="final-score"></h1>
      <p id="final-detail"></p>
      <div id="helper-panel" class="helper-panel" hidden>
        <dl id="helper-stats"></dl>
      </div>
    </div>
    <div class="action-row">
      <button id="helper-toggle" class="big" data-s="final.helper" data-s-label="final.helper.label" aria-expanded="false" aria-controls="helper-panel"></button>
      <button id="play-again" class="big primary" data-s="final.playAgain" data-s-label="final.playAgain.label"></button>
    </div>
  </section>

  <div id="corner-meter" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
