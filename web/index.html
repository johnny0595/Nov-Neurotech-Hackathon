<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brow Explorer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game is-paused">
  <header class="topbar">
    <div id="mode-badge" class="mode-switch" aria-live="polite">
      <div id="mode-walk" class="on"><span>🚶</span>WALK</div>
      <div id="mode-drive"><span>🚗</span>DRIVE<small id="mode-drive-state"></small></div>
    </div>
    <span id="place" class="place" hidden></span>
    <span id="status" class="status"></span>
  </header>

  <section id="look" class="screen">
    <div id="pano"></div>
    <div id="pano-missing" class="pano-missing" hidden>
      <h2>Street View needs a Google Maps key</h2>
      <p>Put <code>GOOGLE_MAPS_API_KEY=…</code> in <code>.env</code> and restart the server.</p>
    </div>
    <div id="aim" class="aim" hidden></div>
    <div id="walk-marker" class="walk-marker" hidden><span>⬆</span><small id="walk-label">raise to walk</small></div>
    <div id="road-edge" class="road-edge" hidden></div>
    <div id="mic" class="mic" hidden></div>
    <div id="look-hint" class="hint"></div>
  </section>

  <!-- for a helper (or for testing): press "/" and type a place -->
  <form id="goto-form" class="goto-form" hidden>
    <input id="goto-input" placeholder="Type a place, e.g. Grand Canyon" autocomplete="off">
  </form>

  <script type="module" src="game.js"></script>
</body>
</html>
